# Consilium orchestrator local runtime.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# The main submission entrypoint is orchestrator.app:a2a_app.

services:
  orchestrator:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      AGENT_MODULE: orchestrator.app:a2a_app
      PORT: "8003"
    ports:
      - "8003:8003"
